<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrintPro 58mm | Smart Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 900px;
            border-radius: var(--border-radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0; /* Previne que flexbox ignore limites */
        }

        .editor-box {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-x: auto; /* Permite rolagem se o texto for largo demais */
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            resize: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            background: transparent;
            white-space: pre; /* IMPEDE que o navegador quebre a linha sozinho, mantendo o formato intacto */
            overflow-wrap: normal;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .btn:active { transform: scale(0.96); }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 600;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .preview-section {
            background-color: #cbd5e1;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            max-height: 550px;
        }

        /* CONFIGURAÇÃO EXATA PARA O TAMANHO DA BOBINA 58MM (32 COLUNAS) */
        .receipt-paper {
            background-color: #ffffff;
            color: #000000;
            width: 32ch; /* Força exatamente 32 caracteres de largura */
            min-width: 32ch;
            max-width: 32ch;
            box-sizing: content-box; /* Garante que os 32ch são apenas para o texto, ignorando o padding */
            padding: 20px 15px 30px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.2;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .receipt-paper::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle at 10px 10px, transparent 12px, #ffffff 13px);
        }

        /* Otimizações drásticas para telas de celular pequenas para não "esmagar" o app */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .workspace { grid-template-columns: 1fr; padding: 15px; gap: 15px; }
            .controls { grid-template-columns: repeat(2, 1fr); }
            .preview-section { padding: 20px 10px; }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-main);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1><i class="fas fa-print"></i> Smart Studio</h1>
            <div id="statusBadge" class="status-badge">
                <i class="fas fa-circle"></i> Desconectado
            </div>
        </header>

        <div class="workspace">
            <!-- Coluna Esquerda: Controles e Edição -->
            <div class="editor-section">
                <div class="controls">
                    <button class="btn" onclick="insertFormat('center')"><i class="fas fa-align-center"></i> Centro</button>
                    <button class="btn" onclick="insertFormat('bold')"><i class="fas fa-bold"></i> Negrito</button>
                    <button class="btn" onclick="insertFormat('separator')"><i class="fas fa-minus"></i> Linha</button>
                    <button class="btn" onclick="insertFormat('qr')"><i class="fas fa-qrcode"></i> QR</button>
                </div>

                <div class="editor-box">
                    <textarea id="textInput" placeholder="Digite o conteúdo aqui..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button id="connectBtn" class="btn" style="flex: 1; border-color: var(--primary-color); color: var(--primary-color);">
                        <i class="fab fa-bluetooth-b"></i> Conectar
                    </button>
                    <button id="printBtn" class="btn btn-primary" style="flex: 2;" disabled>
                        <i class="fas fa-paper-plane"></i> Imprimir Cupom
                    </button>
                </div>
            </div>

            <!-- Coluna Direita: Live Preview -->
            <div class="preview-section">
                <div class="receipt-paper" id="receiptPreview">
                    <!-- O conteúdo renderizado vai aparecer aqui -->
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Mensagem do sistema</div>

    <script>
        const PRINTER_SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
        const ALT_SERVICE = 'e7810a71-73ae-499d-8c15-faa9aef0c3f2';

        let bluetoothDevice = null;
        let printCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const statusBadge = document.getElementById('statusBadge');
        const textInput = document.getElementById('textInput');
        const receiptPreview = document.getElementById('receiptPreview');

        // Texto padrão (exatamente calibrado para 32 colunas)
        textInput.value = "[C][B]LOJA DO DESENVOLVEDOR\n[C]Rua do Codigo, 404\n--------------------------------\n1x CAFE EXPRESSO           5,00\n1x AGUA MINERAL            3,00\n--------------------------------\n[B]TOTAL                      8,00\n\n[C]Acesse nosso cardapio:\n[QR]https://desenvolvedor.com\n\n[C]Obrigado pela visita!";

        // --- SISTEMA DE LIVE PREVIEW (1:1 COM A IMPRESSORA) ---
        function updatePreview() {
            const text = textInput.value;
            const lines = text.split('\n');
            let html = '';

            for (let line of lines) {
                // Tratar renderização visual do QR Code
                if (line.trim().startsWith('[QR]')) {
                    const qrData = line.trim().replace('[QR]', '');
                    if (qrData) {
                        html += `<div style="text-align: center; margin: 10px 0;">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}" alt="QR" style="width: 140px; height: 140px; image-rendering: pixelated;">
                                 </div>`;
                    }
                    continue;
                }

                // Tratar formatações de texto e tags
                let isBold = false;
                let isCenter = false;
                let displayLine = line;

                if (displayLine.includes('[B]')) { isBold = true; displayLine = displayLine.replace('[B]', ''); }
                if (displayLine.includes('[C]')) { isCenter = true; displayLine = displayLine.replace('[C]', ''); }

                // CSS Injetado no simulador (Quebra a linha que excede 32 chars igual a máquina real)
                let style = 'white-space: pre-wrap; word-break: break-all; ';
                
                if (isCenter) style += 'text-align: center; ';
                if (isBold) style += 'font-weight: bold; ';

                // Se a linha estiver vazia após tirar as tags, colocamos um espaço em branco para manter a altura da linha
                html += `<div style="${style}">${displayLine || ' '}</div>`;
            }

            receiptPreview.innerHTML = html;
        }

        textInput.addEventListener('input', updatePreview);
        updatePreview(); // Gera na inicialização

        // --- SISTEMA BLUETOOTH E ESC/POS ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function insertFormat(type) {
            const cursorPos = textInput.selectionStart;
            const text = textInput.value;
            let insertStr = "";

            if (type === 'separator') insertStr = "\n--------------------------------\n";
            else if (type === 'bold') insertStr = "[B]";
            else if (type === 'center') insertStr = "[C]";
            else if (type === 'qr') insertStr = "\n[QR]https://seusite.com.br\n";

            textInput.value = text.slice(0, cursorPos) + insertStr + text.slice(cursorPos);
            textInput.focus();
            updatePreview(); 
        }

        connectBtn.addEventListener('click', async () => {
            try {
                if (!navigator.bluetooth) throw new Error('Navegador sem suporte Bluetooth.');
                
                showToast('Buscando...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [PRINTER_SERVICE, ALT_SERVICE, '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
                
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bluetoothDevice.gatt.connect();
                
                let service;
                try { service = await server.getPrimaryService(PRINTER_SERVICE); } 
                catch (e) { service = await server.getPrimaryService(ALT_SERVICE); }
                
                const characteristics = await service.getCharacteristics();
                printCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

                if (printCharacteristic) {
                    statusBadge.classList.add('connected');
                    statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> ' + (bluetoothDevice.name || 'Conectado');
                    printBtn.disabled = false;
                    showToast('Pronto para imprimir!');
                }
            } catch (error) {
                showToast('Erro: ' + error.message);
            }
        });

        function onDisconnected() {
            statusBadge.classList.remove('connected');
            statusBadge.innerHTML = '<i class="fas fa-times-circle"></i> Desconectado';
            printBtn.disabled = true;
        }

        function getQRCodeBytes(text) {
            let bytes = [];
            const textBytes = new TextEncoder().encode(text);
            const storeLen = textBytes.length + 3;
            const pL = storeLen & 0xFF;
            const pH = (storeLen >> 8) & 0xFF;

            bytes.push(0x1B, 0x61, 0x01); 
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, 0x06);
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x30);
            bytes.push(0x1D, 0x28, 0x6B, pL, pH, 0x31, 0x50, 0x30);
            bytes.push(...textBytes);
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30);
            bytes.push(0x1B, 0x61, 0x00);

            return bytes;
        }

        printBtn.addEventListener('click', async () => {
            if (!printCharacteristic) return;
            const text = textInput.value;
            if (!text) return;

            try {
                printBtn.disabled = true;
                printBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Imprimindo...';

                let bytes = [];
                bytes.push(0x1B, 0x40);

                const lines = text.split('\n');
                
                for (let line of lines) {
                    const trimmed = line.trim();
                    
                    if (trimmed.startsWith('[QR]')) {
                        const qrData = trimmed.replace('[QR]', '');
                        if (qrData) {
                            bytes.push(...getQRCodeBytes(qrData));
                            bytes.push(0x0A);
                        }
                        continue;
                    }

                    let isBold = false;
                    let isCenter = false;
                    let processLine = line; // Usamos a linha sem .trim() para preservar os espaços

                    if (processLine.includes('[B]')) { isBold = true; processLine = processLine.replace('[B]', ''); }
                    if (processLine.includes('[C]')) { isCenter = true; processLine = processLine.replace('[C]', ''); }

                    if (isCenter) bytes.push(0x1B, 0x61, 1);
                    else bytes.push(0x1B, 0x61, 0);

                    if (isBold) bytes.push(0x1B, 0x45, 1);
                    else bytes.push(0x1B, 0x45, 0);

                    const normalizedLine = processLine.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const encodedText = new TextEncoder().encode(normalizedLine);
                    
                    bytes.push(...encodedText);
                    bytes.push(0x0A);
                }

                bytes.push(0x0A, 0x0A, 0x0A);

                const dataArray = new Uint8Array(bytes);
                const CHUNK_SIZE = 40; 
                
                for (let i = 0; i < dataArray.length; i += CHUNK_SIZE) {
                    const chunk = dataArray.slice(i, i + CHUNK_SIZE);
                    await printCharacteristic.writeValue(chunk);
                    await new Promise(resolve => setTimeout(resolve, 20)); 
                }

            } catch (error) {
                showToast('Falha: ' + error.message);
            } finally {
                printBtn.disabled = false;
                printBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Imprimir Cupom';
            }
        });
    </script>
</body>
</html>
