<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrintPro 58mm | Smart Thermal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 480px;
            border-radius: var(--border-radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .paper-preview {
            background-color: #fff;
            color: #000;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            min-height: 200px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .paper-preview::before {
            content: "57.5mm Papel";
            position: absolute;
            top: -20px;
            left: 0;
            font-size: 10px;
            color: var(--text-muted);
            font-family: sans-serif;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 180px;
            border: none;
            resize: none;
            outline: none;
            font-family: inherit;
            background: transparent;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Atualizado para grade 2x2 */
            gap: 10px;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .btn:active { transform: scale(0.96); }
        .btn i { font-size: 1.2rem; color: var(--text-muted); }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            grid-column: span 2; /* Ocupa as duas colunas */
            flex-direction: row;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 16px;
        }

        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled {
            background-color: #334155;
            border-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .btn-primary:disabled i { color: #64748b; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1><i class="fas fa-print"></i> PrintPro 58mm</h1>
            <div id="statusBadge" class="status-badge">
                <i class="fas fa-circle"></i> Desconectado
            </div>
        </header>

        <div class="content">
            <button id="connectBtn" class="btn" style="grid-column: span 2; flex-direction: row; justify-content: center; background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); color: var(--primary-color);">
                <i class="fab fa-bluetooth-b" style="color: var(--primary-color);"></i> Conectar Impressora
            </button>

            <div class="paper-preview">
                <textarea id="textInput" placeholder="Digite o recibo...&#10;&#10;Use as ferramentas abaixo para formatar ou criar QR Codes automáticos."></textarea>
            </div>

            <div class="controls">
                <button class="btn" onclick="insertFormat('center')">
                    <i class="fas fa-align-center"></i> Centralizar
                </button>
                <button class="btn" onclick="insertFormat('bold')">
                    <i class="fas fa-bold"></i> Negrito
                </button>
                <button class="btn" onclick="insertFormat('separator')">
                    <i class="fas fa-minus"></i> Linha
                </button>
                <button class="btn" onclick="insertFormat('qr')">
                    <i class="fas fa-qrcode"></i> Add QR Code
                </button>
                
                <button id="printBtn" class="btn btn-primary" disabled>
                    <i class="fas fa-paper-plane"></i> Imprimir Recibo
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Mensagem do sistema</div>

    <script>
        const PRINTER_SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
        const ALT_SERVICE = 'e7810a71-73ae-499d-8c15-faa9aef0c3f2';

        let bluetoothDevice = null;
        let printCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const statusBadge = document.getElementById('statusBadge');
        const textInput = document.getElementById('textInput');

        // Textos de exemplo padrão
        textInput.value = "[C][B]LOJA DO DESENVOLVEDOR\n[C]Rua do Codigo, 404\n--------------------------------\n1x CAFE EXPRESSO           5,00\n1x AGUA MINERAL            3,00\n--------------------------------\n[B]TOTAL                      8,00\n\n[C]Acesse nosso cardapio:\n[QR]https://github.com\n\n[C]Obrigado pela visita!";

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        connectBtn.addEventListener('click', async () => {
            try {
                if (!navigator.bluetooth) {
                    showToast('Web Bluetooth não suportado neste navegador.');
                    return;
                }
                showToast('Buscando...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [PRINTER_SERVICE, ALT_SERVICE, '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bluetoothDevice.gatt.connect();
                let service;
                try { service = await server.getPrimaryService(PRINTER_SERVICE); } 
                catch (e) { service = await server.getPrimaryService(ALT_SERVICE); }
                const characteristics = await service.getCharacteristics();
                printCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

                if (printCharacteristic) {
                    statusBadge.classList.add('connected');
                    statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> ' + (bluetoothDevice.name || 'Conectado');
                    printBtn.disabled = false;
                    connectBtn.style.display = 'none';
                    showToast('Pronto para imprimir!');
                }
            } catch (error) {
                showToast('Erro: ' + error.message);
            }
        });

        function onDisconnected() {
            statusBadge.classList.remove('connected');
            statusBadge.innerHTML = '<i class="fas fa-times-circle"></i> Desconectado';
            printBtn.disabled = true;
            connectBtn.style.display = 'flex';
            printCharacteristic = null;
        }

        function insertFormat(type) {
            const cursorPos = textInput.selectionStart;
            const text = textInput.value;
            let insertStr = "";

            if (type === 'separator') insertStr = "\n--------------------------------\n";
            else if (type === 'bold') insertStr = "[B]";
            else if (type === 'center') insertStr = "[C]";
            else if (type === 'qr') insertStr = "\n[QR]https://seusite.com.br\n";

            textInput.value = text.slice(0, cursorPos) + insertStr + text.slice(cursorPos);
            textInput.focus();
        }

        // --- Lógica de geração de QR Code nativo ESC/POS ---
        function getQRCodeBytes(text) {
            let bytes = [];
            const encoder = new TextEncoder();
            const textBytes = encoder.encode(text);
            
            // O tamanho dos dados = tamanho do texto + 3
            const storeLen = textBytes.length + 3;
            const pL = storeLen & 0xFF;         // Byte inferior
            const pH = (storeLen >> 8) & 0xFF;  // Byte superior

            // Comando de Alinhamento: Centralizado antes de imprimir o QR
            bytes.push(0x1B, 0x61, 0x01); 

            // 1. Configurar Modelo do QR (Modelo 2)
            bytes.push(0x1D, 0x28, 0x6B, 0x04, 0x00, 0x31, 0x41, 0x32, 0x00);
            
            // 2. Configurar Tamanho do Módulo (1 a 16. O '6' é um tamanho ótimo para 58mm)
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, 0x06);
            
            // 3. Configurar Nível de Correção de Erro (48 = L, 49 = M, 50 = Q, 51 = H)
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x30); // Usando L (48 / 0x30)
            
            // 4. Armazenar Dados no buffer do QR da impressora
            bytes.push(0x1D, 0x28, 0x6B, pL, pH, 0x31, 0x50, 0x30);
            bytes.push(...textBytes);
            
            // 5. Imprimir o QR armazenado
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30);
            
            // Comando de Alinhamento: Voltar para Esquerda após o QR
            bytes.push(0x1B, 0x61, 0x00); 

            return bytes;
        }

        printBtn.addEventListener('click', async () => {
            if (!printCharacteristic) return;
            const text = textInput.value;
            if (!text) return;

            try {
                printBtn.disabled = true;
                printBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Imprimindo...';

                let bytes = [];
                bytes.push(0x1B, 0x40); // Reset / Initialize

                const lines = text.split('\n');
                
                for (let line of lines) {
                    const trimmed = line.trim();
                    
                    // Verifica se é uma linha de comando QR Code
                    if (trimmed.startsWith('[QR]')) {
                        const qrData = trimmed.replace('[QR]', '');
                        if (qrData) {
                            bytes.push(...getQRCodeBytes(qrData));
                            bytes.push(0x0A); // Quebra de linha após o QR
                        }
                        continue; // Pula a lógica normal de texto
                    }

                    // Lógica normal de texto
                    let isBold = false;
                    let isCenter = false;

                    if (line.includes('[B]')) { isBold = true; line = line.replace('[B]', ''); }
                    if (line.includes('[C]')) { isCenter = true; line = line.replace('[C]', ''); }

                    if (isCenter) bytes.push(0x1B, 0x61, 1);
                    else bytes.push(0x1B, 0x61, 0);

                    if (isBold) bytes.push(0x1B, 0x45, 1);
                    else bytes.push(0x1B, 0x45, 0);

                    const normalizedLine = line.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const encodedText = new TextEncoder().encode(normalizedLine);
                    
                    bytes.push(...encodedText);
                    bytes.push(0x0A);
                }

                // Alimentar papel (3 quebras de linha para destacar fácil)
                bytes.push(0x0A, 0x0A, 0x0A);

                // Envio fragmentado para evitar travamento da conexão BLE
                const dataArray = new Uint8Array(bytes);
                const CHUNK_SIZE = 40; 
                
                for (let i = 0; i < dataArray.length; i += CHUNK_SIZE) {
                    const chunk = dataArray.slice(i, i + CHUNK_SIZE);
                    await printCharacteristic.writeValue(chunk);
                    await new Promise(resolve => setTimeout(resolve, 20)); 
                }

            } catch (error) {
                showToast('Falha: ' + error.message);
            } finally {
                printBtn.disabled = false;
                printBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Imprimir Recibo';
            }
        });
    </script>
</body>
</html>
