<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho Matinal — Clima &amp; Notícias</title>
<style>
  :root{
    --paper:#F7F3EA;
    --panel:#EFE8D6;
    --ink:#221F1B;
    --ink-soft:#6B6355;
    --line:#D9CFB8;
    --accent:#A13D2C;
    --accent-ink:#F7F3EA;
    --ok:#3F6B4B;
    --warn:#A13D2C;
    --mono: ui-monospace, "SFMono-Regular", "IBM Plex Mono", "Courier New", monospace;
    --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --radius: 2px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    line-height:1.45;
    min-height:100vh;
    padding: clamp(0.75rem, 3vw, 2rem);
    -webkit-tap-highlight-color: transparent;
  }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{
    width:100%;
    max-width: 30rem;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:0.75rem;
    padding-bottom: 0.9rem;
    border-bottom: 2px solid var(--ink);
  }
  .title-block h1{
    font-family: var(--display);
    font-size: clamp(1.4rem, 5vw, 1.85rem);
    font-weight:700;
    margin:0 0 0.15rem 0;
    letter-spacing: 0.01em;
  }
  .title-block p{
    margin:0;
    font-size:0.8rem;
    color: var(--ink-soft);
    text-transform: capitalize;
  }
  #btnSettings{
    flex-shrink:0;
    width:2.4rem;
    height:2.4rem;
    border:1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size:1.1rem;
    cursor:pointer;
    border-radius: var(--radius);
  }
  #btnSettings:hover{ background: var(--panel); }

  /* ---------- Status strip ---------- */
  .status{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.82rem;
    padding: 0.65rem 0;
    border-bottom: 1px dashed var(--line);
    color: var(--ink-soft);
  }
  .status .dot{
    width:0.55rem;
    height:0.55rem;
    border-radius:50%;
    background: var(--warn);
    flex-shrink:0;
  }
  .status.is-ok .dot{ background: var(--ok); }
  .status.is-ok{ color: var(--ok); }

  /* ---------- Buttons row ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
    padding: 0.9rem 0;
  }
  button.action{
    flex:1 1 auto;
    min-width: 8.5rem;
    padding: 0.7rem 0.8rem;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    font-family: var(--mono);
    font-size: 0.85rem;
    cursor:pointer;
    border-radius: var(--radius);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button.action.secondary{
    background: transparent;
    color: var(--ink);
  }
  button.action.accent{
    background: var(--accent);
    border-color: var(--accent);
  }
  button.action:hover{ opacity:0.85; }
  button.action:active{ transform: scale(0.98); }
  button.action:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
  }

  /* ---------- Alert / message ---------- */
  .msg{
    display:none;
    font-size:0.82rem;
    padding:0.6rem 0.75rem;
    border-left:3px solid var(--accent);
    background: var(--panel);
    color: var(--ink);
    margin-bottom:0.9rem;
  }
  .msg.show{ display:block; }
  .msg.info{ border-left-color: var(--ok); }

  /* ---------- Settings panel ---------- */
  .panel{
    display:none;
    background: var(--panel);
    border:1px solid var(--line);
    padding: 1rem;
    margin-bottom: 1rem;
    border-radius: var(--radius);
  }
  .panel.open{ display:block; }
  .panel h2{
    font-family: var(--display);
    font-size:1.05rem;
    margin: 0 0 0.85rem 0;
  }
  .field{ margin-bottom: 0.85rem; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block;
    font-size:0.75rem;
    color: var(--ink-soft);
    margin-bottom:0.3rem;
  }
  .field-row{ display:flex; gap:0.5rem; }
  .field-row > *{ flex:1; }
  input[type="text"], select{
    width:100%;
    padding:0.55rem 0.6rem;
    font-family: var(--mono);
    font-size:0.85rem;
    border:1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
  }
  .btn-inline{
    padding:0.55rem 0.7rem;
    font-family: var(--mono);
    font-size:0.78rem;
    border:1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor:pointer;
    border-radius: var(--radius);
    white-space:nowrap;
  }
  .btn-inline:hover{ background: var(--paper); }
  .toggle{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.8rem;
    cursor:pointer;
  }
  .toggle input{ width:1rem; height:1rem; accent-color: var(--accent); }
  .chips{ display:flex; flex-wrap:wrap; gap:0.4rem; }
  .chip{
    padding:0.35rem 0.65rem;
    font-size:0.72rem;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    border-radius: 999px;
  }
  .chip.active{ background: var(--ink); color: var(--paper); }

  /* ---------- Receipt preview ---------- */
  .preview-wrap{
    display:flex;
    justify-content:center;
    padding: 1rem 0 0.5rem 0;
  }
  .receipt{
    width: 100%;
    max-width: calc(var(--paper-ch, 32) * 1.05ch + 2rem);
    background: #FFFDF8;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.02);
    padding: 1.1rem 1rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink);
  }
  .r-line{
    width: calc(var(--paper-ch, 32) * 1ch);
    max-width: 100%;
    margin: 0 auto;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .r-header{ text-align:center; font-weight:700; font-size:1.05em; letter-spacing:0.04em; margin-bottom:0.15rem; }
  .r-sub{ text-align:center; color: var(--ink-soft); margin-bottom:0.15rem; }
  .r-section{ font-weight:700; margin-top:0.5rem; margin-bottom:0.15rem; }
  .r-item{ margin-bottom:0.1rem; }
  .r-news{ margin-bottom:0.35rem; }
  .r-divider{ text-align:center; color: var(--ink-soft); margin: 0.35rem 0; letter-spacing:0.05em; }
  .r-spacer{ height:0.6rem; }
  .r-empty{ text-align:center; color: var(--ink-soft); padding: 1.5rem 0; font-style:italic; }

  footer{
    padding-top:1rem;
    font-size:0.72rem;
    color: var(--ink-soft);
    text-align:center;
  }
  footer a{ color: var(--ink-soft); }

  @media (max-width: 380px){
    button.action{ min-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-block">
      <h1>Despacho Matinal</h1>
      <p id="dateLine">carregando data…</p>
    </div>
    <button id="btnSettings" aria-label="Abrir configurações" title="Configurações">⚙</button>
  </header>

  <div class="status" id="statusStrip">
    <span class="dot"></span>
    <span id="statusText">Impressora desconectada</span>
  </div>

  <div class="msg" id="msgBox" role="alert"></div>

  <section class="panel" id="settingsPanel" aria-label="Configurações">
    <h2>Configurações</h2>

    <div class="field">
      <label for="inputName">Seu nome (para a saudação)</label>
      <input type="text" id="inputName" placeholder="Ex.: Marina" autocomplete="off">
    </div>

    <div class="field">
      <label for="inputCity">Cidade para o clima</label>
      <div class="field-row">
        <input type="text" id="inputCity" placeholder="Ex.: Curitiba, BR" autocomplete="off">
        <button class="btn-inline" id="btnGeo" type="button">📍 Usar local</button>
      </div>
    </div>

    <div class="field">
      <label for="selectCategory">Notícias</label>
      <div class="chips" id="categoryChips">
        <button class="chip active" data-cat="geral" type="button">Geral</button>
        <button class="chip" data-cat="tecnologia" type="button">Tecnologia</button>
        <button class="chip" data-cat="economia" type="button">Economia</button>
        <button class="chip" data-cat="esportes" type="button">Esportes</button>
      </div>
    </div>

    <div class="field">
      <label for="selectWidth">Largura do papel</label>
      <select id="selectWidth">
        <option value="32">58 mm (32 colunas)</option>
        <option value="48">80 mm (48 colunas)</option>
      </select>
    </div>

    <div class="field">
      <label class="toggle">
        <input type="checkbox" id="toggleAccents" checked>
        Remover acentos ao imprimir (recomendado — evita caracteres estranhos em impressoras que não suportam UTF-8)
      </label>
    </div>

    <div class="field">
      <label class="toggle">
        <input type="checkbox" id="toggleCut">
        Cortar papel automaticamente ao final (apenas se sua impressora tiver guilhotina)
      </label>
    </div>
  </section>

  <div class="controls">
    <button class="action secondary" id="btnConnect" type="button">Conectar impressora</button>
    <button class="action secondary" id="btnRefresh" type="button">Atualizar conteúdo</button>
    <button class="action accent" id="btnPrint" type="button" disabled>Imprimir despacho</button>
  </div>

  <div class="preview-wrap">
    <div class="receipt" id="receipt">
      <div class="r-empty">Toque em "Atualizar conteúdo" para buscar o clima e as notícias de hoje.</div>
    </div>
  </div>

  <footer>
    Conexão via Web Bluetooth (protocolo ESC/POS) · funciona no Chrome/Edge para Android e desktop. Não é compatível com Safari/iOS.
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     ESTADO (mantido apenas em memória, nunca salvo em disco)
     ========================================================= */
  const state = {
    userName: "",
    city: "",
    coords: null,        // {lat, lon, label}
    category: "geral",
    paperWidth: 32,
    removeAccents: true,
    cutPaper: false,
    weather: null,
    news: null,
    lastFetchedAt: null,
    device: null,
    characteristic: null
  };

  const NEWS_FEEDS = {
    geral:      "https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-BR",
    tecnologia: "https://news.google.com/rss/search?q=tecnologia&hl=pt-BR&gl=BR&ceid=BR:pt-BR",
    economia:   "https://news.google.com/rss/search?q=economia&hl=pt-BR&gl=BR&ceid=BR:pt-BR",
    esportes:   "https://news.google.com/rss/search?q=esportes&hl=pt-BR&gl=BR&ceid=BR:pt-BR"
  };

  const WEATHER_CODES = {
    0:"Céu limpo", 1:"Poucas nuvens", 2:"Parcialmente nublado", 3:"Nublado",
    45:"Neblina", 48:"Neblina com geada",
    51:"Garoa fraca", 53:"Garoa", 55:"Garoa forte",
    56:"Garoa congelante", 57:"Garoa congelante forte",
    61:"Chuva fraca", 63:"Chuva", 65:"Chuva forte",
    66:"Chuva congelante", 67:"Chuva congelante forte",
    71:"Neve fraca", 73:"Neve", 75:"Neve forte", 77:"Grãos de neve",
    80:"Pancadas de chuva fracas", 81:"Pancadas de chuva", 82:"Pancadas de chuva fortes",
    85:"Pancadas de neve fracas", 86:"Pancadas de neve fortes",
    95:"Trovoadas", 96:"Trovoadas com granizo", 99:"Trovoadas com granizo forte"
  };

  /* =========================================================
     ELEMENTOS
     ========================================================= */
  const el = {
    dateLine: document.getElementById("dateLine"),
    statusStrip: document.getElementById("statusStrip"),
    statusText: document.getElementById("statusText"),
    msgBox: document.getElementById("msgBox"),
    btnSettings: document.getElementById("btnSettings"),
    settingsPanel: document.getElementById("settingsPanel"),
    inputName: document.getElementById("inputName"),
    inputCity: document.getElementById("inputCity"),
    btnGeo: document.getElementById("btnGeo"),
    categoryChips: document.getElementById("categoryChips"),
    selectWidth: document.getElementById("selectWidth"),
    toggleAccents: document.getElementById("toggleAccents"),
    toggleCut: document.getElementById("toggleCut"),
    btnConnect: document.getElementById("btnConnect"),
    btnRefresh: document.getElementById("btnRefresh"),
    btnPrint: document.getElementById("btnPrint"),
    receipt: document.getElementById("receipt")
  };

  /* =========================================================
     UTIL: mensagens, data/hora
     ========================================================= */
  function showMsg(text, type){
    el.msgBox.textContent = text;
    el.msgBox.className = "msg show" + (type === "info" ? " info" : "");
  }
  function hideMsg(){
    el.msgBox.className = "msg";
  }

  function updateDateLine(){
    const now = new Date();
    const formatted = now.toLocaleDateString("pt-BR", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    el.dateLine.textContent = formatted;
  }

  function greetingForHour(hour){
    if(hour < 12) return "Bom dia";
    if(hour < 18) return "Boa tarde";
    return "Boa noite";
  }

  function removerAcentos(str){
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  /* =========================================================
     BUSCA: CLIMA (Open-Meteo — sem necessidade de chave de API)
     ========================================================= */
  async function geocodeCity(cityName){
    const url = "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(cityName) + "&count=1&language=pt&format=json";
    const res = await fetch(url);
    if(!res.ok) throw new Error("Não foi possível buscar a cidade.");
    const data = await res.json();
    if(!data.results || !data.results.length) throw new Error("Cidade não encontrada. Tente outro nome.");
    const r = data.results[0];
    return { lat: r.latitude, lon: r.longitude, label: [r.name, r.admin1, r.country].filter(Boolean).join(", ") };
  }

  async function fetchWeather(lat, lon){
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto";
    const res = await fetch(url);
    if(!res.ok) throw new Error("Não foi possível obter a previsão do tempo.");
    return res.json();
  }

  async function loadWeather(){
    let coords = state.coords;
    if(!coords){
      if(!state.city) throw new Error("Informe uma cidade nas configurações (ou use sua localização).");
      coords = await geocodeCity(state.city);
      state.coords = coords;
    }
    const data = await fetchWeather(coords.lat, coords.lon);
    const desc = WEATHER_CODES[data.current.weather_code] || "Condição desconhecida";
    return {
      label: coords.label,
      tempNow: Math.round(data.current.temperature_2m),
      humidity: Math.round(data.current.relative_humidity_2m),
      wind: Math.round(data.current.wind_speed_10m),
      desc: desc,
      tempMax: Math.round(data.daily.temperature_2m_max[0]),
      tempMin: Math.round(data.daily.temperature_2m_min[0]),
      rainChance: data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[0] : null
    };
  }

  /* =========================================================
     BUSCA: NOTÍCIAS (RSS via proxy público, sem necessidade de chave)
     ========================================================= */
  async function loadNews(){
    const feedUrl = NEWS_FEEDS[state.category] || NEWS_FEEDS.geral;
    const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(feedUrl);
    const res = await fetch(proxied);
    if(!res.ok) throw new Error("Não foi possível obter as notícias.");
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, "text/xml");
    if(xml.querySelector("parsererror")) throw new Error("Formato de notícias inválido.");
    const items = Array.from(xml.querySelectorAll("item")).slice(0, 6);
    if(!items.length) throw new Error("Nenhuma notícia encontrada agora.");
    return items.map(function(it){
      const raw = (it.querySelector("title") && it.querySelector("title").textContent) || "";
      return raw.trim();
    }).filter(Boolean);
  }

  /* =========================================================
     CONSTRUÇÃO DO CONTEÚDO (linhas lógicas, usadas tanto na
     pré-visualização quanto na impressão ESC/POS)
     ========================================================= */
  function buildLines(){
    const lines = [];
    const now = new Date();
    const timeStr = now.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });

    lines.push({ type:"header", text:"DESPACHO MATINAL" });
    lines.push({ type:"sub", text: now.toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long" }) });
    if(state.userName){
      lines.push({ type:"sub", text: greetingForHour(now.getHours()) + ", " + state.userName + "!" });
    }
    lines.push({ type:"divider" });

    lines.push({ type:"section", text:"CLIMA" });
    if(state.weather){
      const w = state.weather;
      lines.push({ type:"item", text: w.label });
      lines.push({ type:"item", text: "Agora: " + w.tempNow + "\u00B0C, " + w.desc });
      lines.push({ type:"item", text: "Maxima " + w.tempMax + "\u00B0C / Minima " + w.tempMin + "\u00B0C" });
      lines.push({ type:"item", text: "Umidade " + w.humidity + "% / Vento " + w.wind + " km/h" });
      if(w.rainChance !== null){
        lines.push({ type:"item", text: "Chance de chuva: " + w.rainChance + "%" });
      }
    } else {
      lines.push({ type:"item", text:"Dados do clima ainda nao carregados." });
    }
    lines.push({ type:"divider" });

    lines.push({ type:"section", text:"PRINCIPAIS NOTICIAS" });
    if(state.news && state.news.length){
      state.news.forEach(function(title, i){
        lines.push({ type:"news", index: i + 1, text: title });
      });
    } else {
      lines.push({ type:"item", text:"Nenhuma noticia carregada." });
    }
    lines.push({ type:"divider" });
    lines.push({ type:"sub", text:"Impresso as " + timeStr });
    lines.push({ type:"spacer" });

    return lines;
  }

  /* =========================================================
     PRÉ-VISUALIZAÇÃO (HTML)
     ========================================================= */
  function renderPreview(){
    document.documentElement.style.setProperty("--paper-ch", state.paperWidth);
    const lines = buildLines();
    const frag = document.createDocumentFragment();

    lines.forEach(function(line){
      const div = document.createElement("div");
      div.className = "r-line";
      if(line.type === "header"){
        div.classList.add("r-header");
        div.textContent = line.text;
      } else if(line.type === "sub"){
        div.classList.add("r-sub");
        div.textContent = line.text;
      } else if(line.type === "section"){
        div.classList.add("r-section");
        div.textContent = line.text;
      } else if(line.type === "item"){
        div.classList.add("r-item");
        div.textContent = line.text;
      } else if(line.type === "news"){
        div.classList.add("r-news");
        div.textContent = line.index + ". " + line.text;
      } else if(line.type === "divider"){
        div.classList.add("r-divider");
        div.textContent = "\u2500".repeat(Math.min(state.paperWidth, 48));
      } else if(line.type === "spacer"){
        div.classList.add("r-spacer");
      }
      frag.appendChild(div);
    });

    el.receipt.innerHTML = "";
    el.receipt.appendChild(frag);
  }

  /* =========================================================
     ESC/POS: geração de bytes
     ========================================================= */
  const ESC = 0x1B, GS = 0x1D;
  function bytesInit(){ return [ESC, 0x40]; }
  function bytesAlign(n){ return [ESC, 0x61, n]; }        // 0 esquerda, 1 centro
  function bytesBold(on){ return [ESC, 0x45, on ? 1 : 0]; }
  function bytesDouble(on){ return [GS, 0x21, on ? 0x11 : 0x00]; }
  function bytesFeed(n){ return [ESC, 0x64, n]; }
  function bytesCut(){ return [GS, 0x56, 0x01]; }

  function textToBytes(str){
    const cleaned = state.removeAccents ? removerAcentos(str) : str;
    return Array.from(new TextEncoder().encode(cleaned + "\n"));
  }

  function buildEscPos(){
    const lines = buildLines();
    let out = [];
    out = out.concat(bytesInit());

    lines.forEach(function(line){
      if(line.type === "header"){
        out = out.concat(bytesAlign(1), bytesBold(true), bytesDouble(true));
        out = out.concat(textToBytes(line.text));
        out = out.concat(bytesDouble(false), bytesBold(false), bytesAlign(0));
      } else if(line.type === "sub"){
        out = out.concat(bytesAlign(1));
        out = out.concat(textToBytes(line.text));
        out = out.concat(bytesAlign(0));
      } else if(line.type === "section"){
        out = out.concat(bytesBold(true));
        out = out.concat(textToBytes(line.text));
        out = out.concat(bytesBold(false));
      } else if(line.type === "item"){
        out = out.concat(textToBytes(line.text));
      } else if(line.type === "news"){
        out = out.concat(textToBytes(line.index + ". " + line.text));
      } else if(line.type === "divider"){
        out = out.concat(textToBytes("-".repeat(state.paperWidth)));
      } else if(line.type === "spacer"){
        out = out.concat(textToBytes(""));
      }
    });

    out = out.concat(bytesFeed(3));
    if(state.cutPaper) out = out.concat(bytesCut());
    return new Uint8Array(out);
  }

  /* =========================================================
     BLUETOOTH (Web Bluetooth API, protocolo ESC/POS)
     ========================================================= */
  const KNOWN_SERVICE_UUIDS = [
    "000018f0-0000-1000-8000-00805f9b34fb",
    "0000ff00-0000-1000-8000-00805f9b34fb",
    "49535343-fe7d-4ae5-8fa9-9fafd205e455",
    "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
  ];

  async function connectPrinter(){
    if(!navigator.bluetooth){
      throw new Error("Este navegador não suporta Web Bluetooth. Use Chrome ou Edge (Android ou desktop).");
    }
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: KNOWN_SERVICE_UUIDS
    });
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();

    let writable = null;
    for(const service of services){
      let chars = [];
      try{ chars = await service.getCharacteristics(); } catch(e){ continue; }
      for(const ch of chars){
        if(ch.properties.write || ch.properties.writeWithoutResponse){
          writable = ch;
          break;
        }
      }
      if(writable) break;
    }
    if(!writable){
      throw new Error("Impressora conectada, mas nenhuma característica de escrita foi encontrada.");
    }

    device.addEventListener("gattserverdisconnected", onPrinterDisconnected);

    state.device = device;
    state.characteristic = writable;
  }

  function onPrinterDisconnected(){
    state.device = null;
    state.characteristic = null;
    updateStatus();
  }

  async function sendToPrinter(bytes){
    if(!state.characteristic) throw new Error("Impressora não conectada.");
    const chunkSize = 20;
    for(let i = 0; i < bytes.length; i += chunkSize){
      const chunk = bytes.slice(i, i + chunkSize);
      if(state.characteristic.properties.writeWithoutResponse){
        await state.characteristic.writeValueWithoutResponse(chunk);
      } else {
        await state.characteristic.writeValue(chunk);
      }
      await new Promise(function(r){ setTimeout(r, 15); });
    }
  }

  /* =========================================================
     STATUS / UI
     ========================================================= */
  function updateStatus(){
    const connected = !!state.characteristic;
    el.statusStrip.className = "status" + (connected ? " is-ok" : "");
    el.statusText.textContent = connected
      ? "Impressora conectada" + (state.device && state.device.name ? " — " + state.device.name : "")
      : "Impressora desconectada";
    el.btnConnect.textContent = connected ? "Desconectar impressora" : "Conectar impressora";
    el.btnPrint.disabled = !connected || !state.weather && !state.news;
  }

  function setBusy(button, busyLabel){
    button.dataset.originalLabel = button.textContent;
    button.textContent = busyLabel;
    button.disabled = true;
  }
  function clearBusy(button){
    if(button.dataset.originalLabel) button.textContent = button.dataset.originalLabel;
    button.disabled = false;
  }

  /* =========================================================
     AÇÕES
     ========================================================= */
  async function handleConnect(){
    hideMsg();
    if(state.characteristic){
      try{ state.device.gatt.disconnect(); } catch(e){}
      state.device = null;
      state.characteristic = null;
      updateStatus();
      return;
    }
    setBusy(el.btnConnect, "Conectando…");
    try{
      await connectPrinter();
      showMsg("Impressora conectada com sucesso.", "info");
    } catch(err){
      showMsg(err.message || "Não foi possível conectar à impressora.");
    } finally {
      clearBusy(el.btnConnect);
      updateStatus();
    }
  }

  async function handleRefresh(){
    hideMsg();
    setBusy(el.btnRefresh, "Atualizando…");
    const results = await Promise.allSettled([ loadWeather(), loadNews() ]);

    if(results[0].status === "fulfilled"){
      state.weather = results[0].value;
    } else {
      state.weather = null;
    }
    if(results[1].status === "fulfilled"){
      state.news = results[1].value;
    } else {
      state.news = null;
    }

    const errors = results.filter(r => r.status === "rejected").map(r => r.reason.message);
    if(errors.length){
      showMsg(errors.join(" "));
    } else {
      showMsg("Conteúdo atualizado.", "info");
    }

    renderPreview();
    updateStatus();
    clearBusy(el.btnRefresh);
  }

  async function handlePrint(){
    hideMsg();
    setBusy(el.btnPrint, "Imprimindo…");
    try{
      const bytes = buildEscPos();
      await sendToPrinter(bytes);
      showMsg("Despacho enviado para a impressora.", "info");
    } catch(err){
      showMsg(err.message || "Falha ao imprimir.");
    } finally {
      clearBusy(el.btnPrint);
    }
  }

  async function handleGeo(){
    hideMsg();
    if(!navigator.geolocation){
      showMsg("Geolocalização não é suportada neste navegador.");
      return;
    }
    setBusy(el.btnGeo, "Localizando…");
    navigator.geolocation.getCurrentPosition(function(pos){
      state.coords = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        label: "Sua localização"
      };
      state.city = "";
      el.inputCity.value = "";
      clearBusy(el.btnGeo);
      showMsg("Localização definida. Toque em \"Atualizar conteúdo\".", "info");
    }, function(err){
      clearBusy(el.btnGeo);
      showMsg("Não foi possível obter sua localização: " + err.message);
    }, { timeout: 8000 });
  }

  /* =========================================================
     EVENTOS DE CONFIGURAÇÃO
     ========================================================= */
  el.btnSettings.addEventListener("click", function(){
    el.settingsPanel.classList.toggle("open");
  });

  el.inputName.addEventListener("input", function(){
    state.userName = el.inputName.value.trim();
    renderPreview();
  });

  el.inputCity.addEventListener("input", function(){
    state.city = el.inputCity.value.trim();
    state.coords = null;
  });

  el.btnGeo.addEventListener("click", handleGeo);

  el.categoryChips.addEventListener("click", function(e){
    const chip = e.target.closest(".chip");
    if(!chip) return;
    state.category = chip.dataset.cat;
    Array.from(el.categoryChips.children).forEach(c => c.classList.toggle("active", c === chip));
  });

  el.selectWidth.addEventListener("change", function(){
    state.paperWidth = parseInt(el.selectWidth.value, 10);
    renderPreview();
  });

  el.toggleAccents.addEventListener("change", function(){
    state.removeAccents = el.toggleAccents.checked;
  });

  el.toggleCut.addEventListener("change", function(){
    state.cutPaper = el.toggleCut.checked;
  });

  el.btnConnect.addEventListener("click", handleConnect);
  el.btnRefresh.addEventListener("click", handleRefresh);
  el.btnPrint.addEventListener("click", handlePrint);

  /* =========================================================
     INICIALIZAÇÃO
     ========================================================= */
  function init(){
    updateDateLine();
    setInterval(updateDateLine, 60 * 1000);
    document.documentElement.style.setProperty("--paper-ch", state.paperWidth);
    updateStatus();
    if(!navigator.bluetooth){
      el.btnConnect.disabled = true;
      showMsg("Seu navegador não suporta Web Bluetooth. Abra este app no Chrome ou Edge (Android ou computador) para conectar a impressora.");
    }
  }

  init();
})();
</script>
</body>
</html>
